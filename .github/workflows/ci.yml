name: ML Serving CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train deterministic test model
        run: python training/train.py
      - name: Run automated tests
        run: python -m pytest -q tests
      - name: Run microbatch comparison
        if: matrix.python-version == '3.11'
        run: python -m benchmarks.compare --requests 150 --concurrency 16 --trials 3 --output results/comparison.json
      - name: Upload benchmark report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: microbatch-comparison
          path: results/comparison.json
          retention-days: 30
